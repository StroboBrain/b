<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; manifest-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#000000">
    <meta name="color-scheme" content="dark">
    <meta name="description" content="a simple breathing timer with adjustable timing and local presets.">
    <meta name="mobile-web-app-capable" content="yes">
    <title>b</title>
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="./icons/icon-192.png">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="stylesheet" href="./styles.css">
    <script type="module" src="./js/main.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#practice">skip to exercise</a>
    <div class="app-shell">
      <main>
        <h1 class="sr-only">breathing exercise</h1>
        <div class="practice-layout">
          <section id="practice" class="practice-card" aria-label="breathing exercise" tabindex="-1">
            <button id="zen-back" class="button button-outline" type="button" aria-label="stop exercise and return to setup" hidden>
              <svg class="line-icon back-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m9 4-5 5 5 5M4 9h10a6 6 0 0 1 0 12h-2"/></svg>
            </button>

            <div id="breathing-visual" class="breathing-visual" data-state="idle" data-phase="inhale" data-hold-feedback="rise" aria-hidden="true">
              <div id="breathing-orb" class="breathing-orb">
                <div class="hold-feedback"><div id="hold-fill" class="hold-fill"></div></div>
              </div>
              <svg class="breath-guide breath-guide-min" focusable="false"><circle/></svg>
              <svg class="breath-guide breath-guide-max" focusable="false"><circle/></svg>
              <div class="orb-copy">
                <span id="phase-caption" class="phase-caption">inhale</span>
                <span id="phase-count" class="phase-count">4</span>
              </div>
            </div>

            <p id="phase-announcement" class="sr-only" role="status"></p>
            <ol id="phase-track" class="phase-track" aria-label="breathing sequence">
              <li class="phase-step" data-phase="inhale"><span class="phase-dot" aria-hidden="true"></span><span>inhale</span><span class="phase-time" id="track-inhale">4s</span></li>
              <li class="phase-step" data-phase="holdIn"><span class="phase-dot" aria-hidden="true"></span><span>hold</span><span class="phase-time" id="track-holdIn">4s</span></li>
              <li class="phase-step" data-phase="exhale"><span class="phase-dot" aria-hidden="true"></span><span>exhale</span><span class="phase-time" id="track-exhale">4s</span></li>
              <li class="phase-step" data-phase="holdOut"><span class="phase-dot" aria-hidden="true"></span><span>hold</span><span class="phase-time" id="track-holdOut">4s</span></li>
            </ol>

            <button id="session-button" class="button button-primary" type="button" disabled><span id="session-button-icon" class="icon-play" aria-hidden="true"></span><span id="session-button-label" class="sr-only">start</span></button>
            <fieldset id="preset-fields" class="preset-options">
              <legend>presets</legend>
              <div id="preset-tiles" class="preset-tiles" role="radiogroup" aria-label="breathing presets"></div>
            </fieldset>
            <fieldset class="display-options">
              <legend>display</legend>
              <div class="display-controls">
                <label class="display-toggle"><input id="show-breath-text" class="toggle-mark" type="checkbox" checked>text</label>
                <label class="display-toggle"><input id="show-breath-guides" class="toggle-mark" type="checkbox" checked>guides</label>
                <label class="display-toggle"><input id="show-breath-numbers" class="toggle-mark" type="checkbox" checked>time</label>
                <label class="display-toggle"><input id="show-phase-timings" class="toggle-mark" type="checkbox" checked>timings</label>
                <label class="display-toggle"><input id="fade-buttons" class="toggle-mark" type="checkbox">fade buttons</label>
                <label class="display-toggle"><input id="sound-cue" class="toggle-mark" type="checkbox">sound cue</label>
              </div>
            </fieldset>
            <fieldset id="hold-feedback-fields" class="hold-options">
              <legend id="hold-feedback-heading">hold feedback<span class="hold-empty-note label-detail"> (no hold selected)</span></legend>
              <div id="hold-choices" class="hold-choices" role="radiogroup" aria-labelledby="hold-feedback-heading">
                <label class="hold-choice" data-hold-feedback="rise" title="fill from the bottom">
                  <input class="sr-only" type="radio" name="hold-feedback" value="rise" checked>
                  <span class="hold-sample" aria-hidden="true"><span class="hold-fill"></span></span>
                  <span>rise</span>
                </label>
                <label class="hold-choice" data-hold-feedback="sweep" title="fill clockwise">
                  <input class="sr-only" type="radio" name="hold-feedback" value="sweep">
                  <span class="hold-sample" aria-hidden="true"><span class="hold-fill"></span></span>
                  <span>sweep</span>
                </label>
                <label class="hold-choice" data-hold-feedback="spread" title="fill from the center">
                  <input class="sr-only" type="radio" name="hold-feedback" value="spread">
                  <span class="hold-sample" aria-hidden="true"><span class="hold-fill"></span></span>
                  <span>spread</span>
                </label>
                <label class="hold-choice" data-hold-feedback="fade" title="brighten the whole circle">
                  <input class="sr-only" type="radio" name="hold-feedback" value="fade">
                  <span class="hold-sample" aria-hidden="true"><span class="hold-fill"></span></span>
                  <span>fade</span>
                </label>
              </div>
            </fieldset>
          </section>

          <fieldset class="settings-card">
            <legend id="settings-heading">customize presets</legend>
            <form id="settings-form">
              <fieldset id="settings-fields">
                <legend class="sr-only">preset settings</legend>
                <div class="preset-field">
                  <label for="preset-selector">edit preset</label>
                  <div class="preset-select-row">
                    <select id="preset-selector" name="preset"></select>
                    <button id="delete-preset" class="button button-outline delete-preset" type="button" aria-label="delete selected preset" title="delete selected preset">
                      <svg class="line-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7m4-7v7"/></svg>
                    </button>
                  </div>
                </div>
                <div class="preset-field">
                  <label for="preset-name">preset name</label>
                  <input id="preset-name" type="text" autocapitalize="none" maxlength="32" required autocomplete="off" value="box breathing">
                </div>

                <div id="timing-fields" class="timing-fields">
                  <fieldset class="timing-field" aria-labelledby="inhale-label">
                    <legend id="inhale-label" class="phase-title">inhale</legend>
                    <div class="timing-label">
                      <button id="inhale-value" class="duration-button" type="button" data-field="inhale" value="4" aria-haspopup="dialog" aria-controls="inhale-picker" aria-expanded="false" aria-label="adjust inhale duration, 4 seconds">4s</button>
                    </div>
                    <div class="time-choices" role="group" aria-label="quick inhale duration in seconds">
                      <button class="time-choice" type="button" data-field="inhale" data-value="2" aria-pressed="false">2s</button>
                      <button class="time-choice" type="button" data-field="inhale" data-value="4" aria-pressed="true">4s</button>
                      <button class="time-choice" type="button" data-field="inhale" data-value="5" aria-pressed="false">5s</button>
                      <button class="time-choice" type="button" data-field="inhale" data-value="6" aria-pressed="false">6s</button>
                      <button class="time-choice" type="button" data-field="inhale" data-value="8" aria-pressed="false">8s</button>
                      <button class="time-choice" type="button" data-field="inhale" data-value="10" aria-pressed="false">10s</button>
                    </div>
                    <div id="inhale-picker" class="duration-picker" popover="auto" role="dialog" aria-label="inhale duration">
                      <span class="picker-heading">inhale</span>
                      <output id="inhale-picked-value" class="picker-value" for="inhale-slider">4s</output>
                      <input id="inhale-slider" class="duration-slider" type="range" data-field="inhale" min="1" max="60" step="1" value="4" aria-label="inhale duration in seconds" aria-orientation="vertical">
                      <button class="button button-outline picker-done" type="button" popovertarget="inhale-picker" popovertargetaction="hide">done</button>
                    </div>
                  </fieldset>
                  <fieldset class="timing-field" aria-labelledby="holdIn-label">
                    <legend id="holdIn-label" class="phase-title">hold <span class="label-detail">after inhale</span></legend>
                    <div class="timing-label">
                      <button id="holdIn-value" class="duration-button" type="button" data-field="holdIn" value="4" aria-haspopup="dialog" aria-controls="holdIn-picker" aria-expanded="false" aria-label="adjust hold after inhale duration, 4 seconds">4s</button>
                    </div>
                    <div class="time-choices" role="group" aria-label="quick hold after inhale duration in seconds">
                      <button class="time-choice" type="button" data-field="holdIn" data-value="0" aria-pressed="false">off</button>
                      <button class="time-choice" type="button" data-field="holdIn" data-value="2" aria-pressed="false">2s</button>
                      <button class="time-choice" type="button" data-field="holdIn" data-value="4" aria-pressed="true">4s</button>
                      <button class="time-choice" type="button" data-field="holdIn" data-value="7" aria-pressed="false">7s</button>
                      <button class="time-choice" type="button" data-field="holdIn" data-value="10" aria-pressed="false">10s</button>
                      <button class="time-choice" type="button" data-field="holdIn" data-value="15" aria-pressed="false">15s</button>
                    </div>
                    <div id="holdIn-picker" class="duration-picker" popover="auto" role="dialog" aria-label="hold after inhale duration">
                      <span class="picker-heading">hold after inhale</span>
                      <output id="holdIn-picked-value" class="picker-value" for="holdIn-slider">4s</output>
                      <input id="holdIn-slider" class="duration-slider" type="range" data-field="holdIn" min="0" max="60" step="1" value="4" aria-label="hold after inhale duration in seconds" aria-orientation="vertical">
                      <button class="button button-outline picker-done" type="button" popovertarget="holdIn-picker" popovertargetaction="hide">done</button>
                    </div>
                  </fieldset>
                  <fieldset class="timing-field" aria-labelledby="exhale-label">
                    <legend id="exhale-label" class="phase-title">exhale</legend>
                    <div class="timing-label">
                      <button id="exhale-value" class="duration-button" type="button" data-field="exhale" value="4" aria-haspopup="dialog" aria-controls="exhale-picker" aria-expanded="false" aria-label="adjust exhale duration, 4 seconds">4s</button>
                    </div>
                    <div class="time-choices" role="group" aria-label="quick exhale duration in seconds">
                      <button class="time-choice" type="button" data-field="exhale" data-value="2" aria-pressed="false">2s</button>
                      <button class="time-choice" type="button" data-field="exhale" data-value="4" aria-pressed="true">4s</button>
                      <button class="time-choice" type="button" data-field="exhale" data-value="5" aria-pressed="false">5s</button>
                      <button class="time-choice" type="button" data-field="exhale" data-value="6" aria-pressed="false">6s</button>
                      <button class="time-choice" type="button" data-field="exhale" data-value="8" aria-pressed="false">8s</button>
                      <button class="time-choice" type="button" data-field="exhale" data-value="10" aria-pressed="false">10s</button>
                    </div>
                    <div id="exhale-picker" class="duration-picker" popover="auto" role="dialog" aria-label="exhale duration">
                      <span class="picker-heading">exhale</span>
                      <output id="exhale-picked-value" class="picker-value" for="exhale-slider">4s</output>
                      <input id="exhale-slider" class="duration-slider" type="range" data-field="exhale" min="1" max="60" step="1" value="4" aria-label="exhale duration in seconds" aria-orientation="vertical">
                      <button class="button button-outline picker-done" type="button" popovertarget="exhale-picker" popovertargetaction="hide">done</button>
                    </div>
                  </fieldset>
                  <fieldset class="timing-field" aria-labelledby="holdOut-label">
                    <legend id="holdOut-label" class="phase-title">hold <span class="label-detail">after exhale</span></legend>
                    <div class="timing-label">
                      <button id="holdOut-value" class="duration-button" type="button" data-field="holdOut" value="4" aria-haspopup="dialog" aria-controls="holdOut-picker" aria-expanded="false" aria-label="adjust hold after exhale duration, 4 seconds">4s</button>
                    </div>
                    <div class="time-choices" role="group" aria-label="quick hold after exhale duration in seconds">
                      <button class="time-choice" type="button" data-field="holdOut" data-value="0" aria-pressed="false">off</button>
                      <button class="time-choice" type="button" data-field="holdOut" data-value="2" aria-pressed="false">2s</button>
                      <button class="time-choice" type="button" data-field="holdOut" data-value="4" aria-pressed="true">4s</button>
                      <button class="time-choice" type="button" data-field="holdOut" data-value="7" aria-pressed="false">7s</button>
                      <button class="time-choice" type="button" data-field="holdOut" data-value="10" aria-pressed="false">10s</button>
                      <button class="time-choice" type="button" data-field="holdOut" data-value="15" aria-pressed="false">15s</button>
                    </div>
                    <div id="holdOut-picker" class="duration-picker" popover="auto" role="dialog" aria-label="hold after exhale duration">
                      <span class="picker-heading">hold after exhale</span>
                      <output id="holdOut-picked-value" class="picker-value" for="holdOut-slider">4s</output>
                      <input id="holdOut-slider" class="duration-slider" type="range" data-field="holdOut" min="0" max="60" step="1" value="4" aria-label="hold after exhale duration in seconds" aria-orientation="vertical">
                      <button class="button button-outline picker-done" type="button" popovertarget="holdOut-picker" popovertargetaction="hide">done</button>
                    </div>
                  </fieldset>
                </div>
              </fieldset>
            </form>
            <p id="settings-note" class="settings-note"></p>
          </fieldset>
        </div>
        <noscript><p class="noscript-message">enable javascript to customize and start your breathing practice.</p></noscript>
      </main>
      <footer class="install-footer">
        <button id="install-button" class="button button-outline" type="button" hidden>install app</button>
      </footer>
    </div>

    <div id="notification" class="notification" role="status"></div>
  </body>
</html>
