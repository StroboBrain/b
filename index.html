<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; manifest-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#000000">
    <meta name="color-scheme" content="dark">
    <meta name="description" content="a simple breathing timer with adjustable timing and local patterns.">
    <meta name="mobile-web-app-capable" content="yes">
    <title>b</title>
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="./icons/icon-192.png">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="stylesheet" href="./styles.css">
    <link rel="modulepreload" href="./js/app.js">
    <link rel="modulepreload" href="./js/breathing-engine.js">
    <link rel="modulepreload" href="./js/preset-store.js">
    <link rel="modulepreload" href="./js/preset-editor.js">
    <link rel="modulepreload" href="./js/session-driver.js">
    <link rel="modulepreload" href="./js/wake-lock-guard.js">
    <link rel="modulepreload" href="./js/zen-navigator.js">
    <link rel="modulepreload" href="./js/phase-cues.js">
    <link rel="modulepreload" href="./js/offline-support.js">
    <link rel="modulepreload" href="./js/duration-picker.js">
    <link rel="modulepreload" href="./js/preset-tiles.js">
    <link rel="modulepreload" href="./js/phase-labels.js">
    <link rel="modulepreload" href="./js/session-view.js">
    <link rel="modulepreload" href="./js/settings-preview.js">
    <link rel="modulepreload" href="./js/install-prompt.js">
    <link rel="modulepreload" href="./js/outside-dismissal.js">
    <link rel="modulepreload" href="./js/reset-confirmation.js">
    <link rel="modulepreload" href="./js/viewport-layout.js">
    <link rel="modulepreload" href="./js/section-scroller.js">
    <script type="module" src="./js/main.js"></script>
  </head>
  <body>
    <div id="app-shell" class="app-shell" hidden>
      <a class="skip-link" href="#practice">skip to exercise</a>
      <main>
        <h1 class="sr-only">breathing exercise</h1>
        <div class="practice-layout">
          <section id="practice" class="practice-card app-page" data-page="practice" aria-label="breathing exercise" tabindex="-1">
            <div class="practice-primary">
              <div id="breathing-visual" class="breathing-visual" data-state="idle" data-phase="inhale" data-hold-feedback="rise" aria-hidden="true">
                <div id="breathing-orb" class="breathing-orb">
                  <div class="hold-feedback"><div id="hold-fill" class="hold-fill"></div></div>
                </div>
                <svg class="breath-guide breath-guide-min" focusable="false" hidden><circle/></svg>
                <svg class="breath-guide breath-guide-max" focusable="false" hidden><circle/></svg>
                <div class="orb-copy">
                  <span id="phase-caption" class="phase-caption">inhale</span>
                  <span id="phase-count" class="phase-count">4</span>
                </div>
              </div>

              <p id="phase-announcement" class="sr-only" role="status"></p>
              <button id="session-button" class="button button-primary" type="button" disabled><span id="session-button-icon" class="icon-play" aria-hidden="true"></span><span id="session-button-label" class="sr-only">start</span></button>
              <fieldset id="timing-fields" class="phase-timings">
                <legend>timings</legend>
                <ol id="phase-track" class="phase-track" aria-label="breathing sequence">
                  <li class="phase-step" data-phase="inhale">
                    <button id="inhale-value" class="duration-button" type="button" data-field="inhale" value="4" aria-haspopup="dialog" aria-controls="inhale-picker" aria-expanded="false" aria-label="adjust inhale duration, 4 seconds">
                      <span class="phase-label">inhale</span><span class="phase-time" id="track-inhale">4s</span>
                    </button>
                  </li>
                  <li class="phase-step" data-phase="holdIn">
                    <button id="holdIn-value" class="duration-button" type="button" data-field="holdIn" value="4" aria-haspopup="dialog" aria-controls="holdIn-picker" aria-expanded="false" aria-label="adjust hold after inhale duration, 4 seconds">
                      <span class="phase-label">hold</span><span class="phase-time" id="track-holdIn">4s</span>
                    </button>
                  </li>
                  <li class="phase-step" data-phase="exhale">
                    <button id="exhale-value" class="duration-button" type="button" data-field="exhale" value="4" aria-haspopup="dialog" aria-controls="exhale-picker" aria-expanded="false" aria-label="adjust exhale duration, 4 seconds">
                      <span class="phase-label">exhale</span><span class="phase-time" id="track-exhale">4s</span>
                    </button>
                  </li>
                  <li class="phase-step" data-phase="holdOut">
                    <button id="holdOut-value" class="duration-button" type="button" data-field="holdOut" value="4" aria-haspopup="dialog" aria-controls="holdOut-picker" aria-expanded="false" aria-label="adjust hold after exhale duration, 4 seconds">
                      <span class="phase-label">hold</span><span class="phase-time" id="track-holdOut">4s</span>
                    </button>
                  </li>
                </ol>
                <div id="inhale-picker" class="duration-picker" popover="auto" role="dialog" aria-label="inhale duration">
                  <div id="inhale-picker-content" class="picker-content">
                    <button id="inhale-increase" class="duration-step" type="button" data-field="inhale" data-step="1" aria-label="increase inhale duration by one second" title="+1 second">++</button>
                    <button id="inhale-fine-increase" class="duration-step duration-fine-step" type="button" data-field="inhale" data-step="0.1" aria-label="increase inhale duration by 0.1 seconds" title="+0.1 seconds">+</button>
                    <button class="duration-button picker-done picker-center" type="button" data-field="inhale" aria-label="close inhale adjustment">
                      <span class="phase-label">inhale</span>
                      <output id="inhale-picked-value" class="picker-value" for="inhale-increase inhale-fine-increase inhale-fine-decrease inhale-decrease" aria-live="polite" aria-atomic="true">4s</output>
                    </button>
                    <button id="inhale-fine-decrease" class="duration-step duration-fine-step" type="button" data-field="inhale" data-step="-0.1" aria-label="decrease inhale duration by 0.1 seconds" title="-0.1 seconds">-</button>
                    <button id="inhale-decrease" class="duration-step" type="button" data-field="inhale" data-step="-1" aria-label="decrease inhale duration by one second" title="-1 second">--</button>
                  </div>
                </div>
                <div id="holdIn-picker" class="duration-picker" popover="auto" role="dialog" aria-label="hold after inhale duration">
                  <div id="holdIn-picker-content" class="picker-content">
                    <button id="holdIn-increase" class="duration-step" type="button" data-field="holdIn" data-step="1" aria-label="increase hold after inhale duration by one second" title="+1 second">++</button>
                    <button id="holdIn-fine-increase" class="duration-step duration-fine-step" type="button" data-field="holdIn" data-step="0.1" aria-label="increase hold after inhale duration by 0.1 seconds" title="+0.1 seconds">+</button>
                    <button class="duration-button picker-done picker-center" type="button" data-field="holdIn" aria-label="close hold after inhale adjustment">
                      <span class="phase-label">hold</span>
                      <output id="holdIn-picked-value" class="picker-value" for="holdIn-increase holdIn-fine-increase holdIn-fine-decrease holdIn-decrease" aria-live="polite" aria-atomic="true">4s</output>
                    </button>
                    <button id="holdIn-fine-decrease" class="duration-step duration-fine-step" type="button" data-field="holdIn" data-step="-0.1" aria-label="decrease hold after inhale duration by 0.1 seconds" title="-0.1 seconds">-</button>
                    <button id="holdIn-decrease" class="duration-step" type="button" data-field="holdIn" data-step="-1" aria-label="decrease hold after inhale duration by one second" title="-1 second">--</button>
                  </div>
                </div>
                <div id="exhale-picker" class="duration-picker" popover="auto" role="dialog" aria-label="exhale duration">
                  <div id="exhale-picker-content" class="picker-content">
                    <button id="exhale-increase" class="duration-step" type="button" data-field="exhale" data-step="1" aria-label="increase exhale duration by one second" title="+1 second">++</button>
                    <button id="exhale-fine-increase" class="duration-step duration-fine-step" type="button" data-field="exhale" data-step="0.1" aria-label="increase exhale duration by 0.1 seconds" title="+0.1 seconds">+</button>
                    <button class="duration-button picker-done picker-center" type="button" data-field="exhale" aria-label="close exhale adjustment">
                      <span class="phase-label">exhale</span>
                      <output id="exhale-picked-value" class="picker-value" for="exhale-increase exhale-fine-increase exhale-fine-decrease exhale-decrease" aria-live="polite" aria-atomic="true">4s</output>
                    </button>
                    <button id="exhale-fine-decrease" class="duration-step duration-fine-step" type="button" data-field="exhale" data-step="-0.1" aria-label="decrease exhale duration by 0.1 seconds" title="-0.1 seconds">-</button>
                    <button id="exhale-decrease" class="duration-step" type="button" data-field="exhale" data-step="-1" aria-label="decrease exhale duration by one second" title="-1 second">--</button>
                  </div>
                </div>
                <div id="holdOut-picker" class="duration-picker" popover="auto" role="dialog" aria-label="hold after exhale duration">
                  <div id="holdOut-picker-content" class="picker-content">
                    <button id="holdOut-increase" class="duration-step" type="button" data-field="holdOut" data-step="1" aria-label="increase hold after exhale duration by one second" title="+1 second">++</button>
                    <button id="holdOut-fine-increase" class="duration-step duration-fine-step" type="button" data-field="holdOut" data-step="0.1" aria-label="increase hold after exhale duration by 0.1 seconds" title="+0.1 seconds">+</button>
                    <button class="duration-button picker-done picker-center" type="button" data-field="holdOut" aria-label="close hold after exhale adjustment">
                      <span class="phase-label">hold</span>
                      <output id="holdOut-picked-value" class="picker-value" for="holdOut-increase holdOut-fine-increase holdOut-fine-decrease holdOut-decrease" aria-live="polite" aria-atomic="true">4s</output>
                    </button>
                    <button id="holdOut-fine-decrease" class="duration-step duration-fine-step" type="button" data-field="holdOut" data-step="-0.1" aria-label="decrease hold after exhale duration by 0.1 seconds" title="-0.1 seconds">-</button>
                    <button id="holdOut-decrease" class="duration-step" type="button" data-field="holdOut" data-step="-1" aria-label="decrease hold after exhale duration by one second" title="-1 second">--</button>
                  </div>
                </div>
              </fieldset>

              <fieldset id="preset-fields" class="preset-options">
                <legend>patterns</legend>
                <div id="preset-tiles" class="preset-tiles" role="radiogroup" aria-label="breathing patterns"></div>
              </fieldset>
              <p id="settings-note" class="settings-note" role="status"></p>
              <button id="display-settings-button" class="button button-outline settings-link" type="button" aria-controls="display-settings"><span class="nav-arrow nav-arrow-down" aria-hidden="true"></span><span>display settings</span><span class="nav-arrow nav-arrow-down" aria-hidden="true"></span></button>
            </div>
          </section>
          <section id="display-settings" tabindex="-1" class="feedback-page app-page" data-page="feedback" aria-label="display and hold feedback settings">
            <figure id="settings-preview" class="settings-preview" aria-labelledby="preview-heading">
              <figcaption id="preview-heading">preview</figcaption>
              <div class="breathing-visual" data-state="idle" data-phase="inhale" data-hold-feedback="rise" aria-hidden="true">
                <div class="breathing-orb"><div class="hold-feedback"><div class="hold-fill"></div></div></div>
                <svg class="breath-guide breath-guide-min" focusable="false"><circle/></svg>
                <svg class="breath-guide breath-guide-max" focusable="false"><circle/></svg>
                <div class="orb-copy"><span class="phase-caption">inhale</span><span class="phase-count">4</span></div>
              </div>
              <span id="preview-session-button" class="button button-primary preview-session-button" aria-hidden="true"><span class="icon-stop"></span></span>
              <fieldset class="phase-timings" aria-hidden="true">
                <legend>timings</legend>
                <ol id="preview-track" class="phase-track">
                  <li class="phase-step" data-phase="inhale"><span>inhale</span><span class="phase-time">4s</span></li>
                  <li class="phase-step" data-phase="holdIn"><span>hold</span><span class="phase-time">4s</span></li>
                  <li class="phase-step" data-phase="exhale"><span>exhale</span><span class="phase-time">4s</span></li>
                  <li class="phase-step" data-phase="holdOut"><span>hold</span><span class="phase-time">4s</span></li>
                </ol>
              </fieldset>
            </figure>
            <fieldset class="display-options">
              <legend>display settings</legend>
              <div class="display-controls">
                <label class="display-toggle"><span>text</span><input id="show-breath-text" class="toggle-mark" type="checkbox" role="switch" checked></label>
                <label class="display-toggle"><span>guides</span><input id="show-breath-guides" class="toggle-mark" type="checkbox" role="switch"></label>
                <label class="display-toggle"><span>time</span><input id="show-breath-numbers" class="toggle-mark" type="checkbox" role="switch" checked></label>
                <label class="display-toggle"><span>timings</span><input id="show-phase-timings" class="toggle-mark" type="checkbox" role="switch" checked></label>
                <label class="display-toggle"><span>fade buttons</span><input id="fade-buttons" class="toggle-mark" type="checkbox" role="switch"></label>
                <label class="display-toggle"><span>sound cue</span><input id="sound-cue" class="toggle-mark" type="checkbox" role="switch"></label>
              </div>
            </fieldset>
            <fieldset id="hold-feedback-fields" class="hold-options">
              <legend id="hold-feedback-heading">hold feedback settings</legend>
              <div id="hold-choices" class="hold-choices" role="radiogroup" aria-labelledby="hold-feedback-heading">
                <label class="hold-choice" data-hold-feedback="rise" title="fill from the bottom">
                  <input class="sr-only" type="radio" name="hold-feedback" value="rise" checked>
                  <span class="hold-sample" aria-hidden="true"><span class="hold-fill"></span></span>
                  <span>rise</span>
                </label>
                <label class="hold-choice" data-hold-feedback="sweep" title="fill clockwise">
                  <input class="sr-only" type="radio" name="hold-feedback" value="sweep">
                  <span class="hold-sample" aria-hidden="true"><span class="hold-fill"></span></span>
                  <span>sweep</span>
                </label>
                <label class="hold-choice" data-hold-feedback="spread" title="fill from the center">
                  <input class="sr-only" type="radio" name="hold-feedback" value="spread">
                  <span class="hold-sample" aria-hidden="true"><span class="hold-fill"></span></span>
                  <span>spread</span>
                </label>
                <label class="hold-choice" data-hold-feedback="fade" title="brighten the whole circle">
                  <input class="sr-only" type="radio" name="hold-feedback" value="fade">
                  <span class="hold-sample" aria-hidden="true"><span class="hold-fill"></span></span>
                  <span>fade</span>
                </label>
              </div>
            </fieldset>
            <div class="data-options">
              <p id="clear-local-data-note" class="settings-note">restore the default patterns and display settings on this device.</p>
              <button id="clear-local-data-button" class="button button-outline" type="button" aria-describedby="clear-local-data-note" aria-haspopup="dialog" aria-controls="reset-confirmation" aria-expanded="false">reselt all data</button>
              <div id="reset-confirmation" class="reset-confirmation" popover="auto" role="alertdialog" aria-label="reselt all data" aria-describedby="reset-warning" tabindex="-1">
                <div id="reset-confirmation-content" class="reset-confirmation-content">
                  <p id="reset-warning">remove saved changes and restore defaults?</p>
                  <div class="reset-actions">
                    <button id="reset-confirm-button" class="button button-outline" type="button">are you sure</button>
                    <button id="reset-cancel-button" class="button button-outline" type="button">cancel</button>
                  </div>
                </div>
              </div>
            </div>
            <footer class="install-footer">
              <button id="install-button" class="button button-outline" type="button" hidden>install app</button>
            </footer>
            <button id="back-to-breathing-button" class="button button-outline settings-link" type="button" aria-controls="practice"><span class="nav-arrow nav-arrow-up" aria-hidden="true"></span><span>back to breathing</span><span class="nav-arrow nav-arrow-up" aria-hidden="true"></span></button>
          </section>
        </div>
      </main>
      <div id="notification" class="notification" role="status"></div>
    </div>
    <p id="startup-error" class="app-shell noscript-message" role="alert" hidden>the app could not start. reload the page.</p>
    <noscript><div class="app-shell"><p class="noscript-message">enable javascript to customize and start your breathing practice.</p></div></noscript>
  </body>
</html>
